{% extends "base.html" %}
{% load static %}

{% block title %}Долг.Контроль{% endblock %}

{% block content %}
    <div class="m-2 justify-content-center" id="resultTable">
    </div>

    <!-- === AI ЧАТ ПОМОЩНИК === -->
    <div id="ai-chat-widget">

        <button type="button" id="ai-chat-btn" onclick="openAiChat()">
            🤖 AI Ассистент
        </button>

        <div id="ai-chat-window" class="chat-hidden">

            <div class="chat-header">
                <div class="header-left">
                    <div class="status-pulse"></div>
                    <div>
                        <span class="header-title">ИИ Ассистент</span>
                        <small class="header-model">qwen2.5:3b</small>
                    </div>
                </div>
                <div class="header-buttons">
                    <button type="button" class="chat-resize-btn" onclick="toggleResizeAiChat()" title="Развернуть">⤢</button>
                    <button type="button" class="chat-minimize-btn" onclick="minimizeAiChat()" title="Свернуть">−</button>
                    <button type="button" class="chat-close-btn" onclick="closeAiChat()" title="Закрыть">×</button>
                </div>
            </div>

            <div class="chat-body" id="ai-chat-messages">
                <div class="message bot-message">
                    Привет! Я ваш виртуальный помощник. Чем могу помочь?
                </div>
            </div>

            <div id="ai-typing-indicator" class="typing-indicator hidden">
                <span></span><span></span><span></span>
            </div>

            <div class="chat-footer">
                <div class="chat-input-row">
                    <input type="text" id="ai-chat-input" placeholder="Задайте вопрос..." autocomplete="off">
                    <button type="button" id="ai-send-btn" onclick="sendAiMessage()">➤</button>
                </div>
                <div class="chat-hints">
                    <button type="button" class="hint-chip" onclick="useHint('Какие шаблоны доступны?')">📋 Шаблоны</button>
                    <button type="button" class="hint-chip" onclick="useHint('Как подать заявление?')">📝 Заявление</button>
                    <button type="button" class="hint-chip" onclick="useHint('Что такое ДКЗ?')">❓ Помощь</button>
                </div>
            </div>
        </div>

        <button type="button" id="ai-chat-minimized-btn" class="hidden" onclick="restoreAiChat()">
            💬
        </button>
    </div>

{% endblock %}
